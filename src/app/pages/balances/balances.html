<h1>Balances</h1>
<table>
  <tr><th>Name</th><th>Total paid</th><th>Total share</th><th>Balance</th></tr>
  @for (b of svc.balances(); track b.name) {
    <tr>
      <td>{{ b.name }}</td>
      <td>₹{{ b.paid | number: '1.0-2' }}</td>
      <td>₹{{ b.owed | number: '1.0-2' }}</td>
      <td [class.owed]="b.balance >= 0" [class.owes]="b.balance < 0">
        {{ b.balance >= 0 ? 'gets back' : 'owes' }} ₹{{ abs(b.balance) | number: '1.0-2' }}
      </td>
    </tr>
  }
</table>
